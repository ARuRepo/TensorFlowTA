[versions]
agp = "9.0.1"
kotlin = "2.2.10"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
composeBom = "2024.04.01"
navigationCompose = "2.7.7"
rules = "1.6.1"
uiautomator = "2.3.0"
litert = "1.0.1"
litertSupportApi = "1.0.1"
litertGpu = "1.0.1"
litertMetadata = "1.0.1"
